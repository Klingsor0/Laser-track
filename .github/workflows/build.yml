name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Linux build ───────────────────────────────────────────────────────
  # Run inside a Debian 11 (Bullseye) container so the resulting binary
  # only requires GLIBC >= 2.31, compatible with Debian 11+, Ubuntu 20.04+.
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-bullseye

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libfontconfig1 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 \
            binutils

      - name: Install Python dependencies
        run: pip install PyQt6 opencv-python numpy matplotlib scipy pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name laser-track --paths pyqt_app --paths shared_utils pyqt_app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laser-track-linux
          path: dist/laser-track

  # ── Windows build ─────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install PyQt6 opencv-python numpy matplotlib scipy pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name laser-track --paths pyqt_app --paths shared_utils pyqt_app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laser-track-windows
          path: dist/laser-track.exe

  # ── GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/laser-track-linux/laser-track
            artifacts/laser-track-windows/laser-track.exe
          generate_release_notes: true
