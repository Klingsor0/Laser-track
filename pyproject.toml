[project]
name = "laser-track"
version = "0.2.0"
description = "Desktop application for laser path extraction and angle measurement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.12",
]

[project.scripts]
laser-track = "pyqt_app.main:main"
